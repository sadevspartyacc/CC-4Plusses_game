<!DOCTYPE html>
<html>
<head>
    <title>cc++++</title>
    <style>
        body {
            background: #0a0a0a;
            color: #00ffcc;
            font-family: monospace;
            padding: 20px;
        }
        #output {
            background: #1a1a1a;
            border: 1px solid #333;
            height: 90vh;
            overflow-y: auto;
            padding: 10px;
            white-space: pre-wrap;
            font-family: monospace;
        }
        .log { color: #00ffcc; }
        .warn { color: #ffcc00; }
        .error { color: #ff4444; }
        .success { color: #88ff88; }
    </style>
</head>
<body>
    <div id="output">> waiting for code.txt...</div>

    <script>
        let V = {};

        function out(type, msg) {
            let o = document.getElementById('output');
            let c = { log: 'log', warn: 'warn', error: 'error', success: 'success' } [type] || 'log';
            o.innerHTML += `<div class="${c}">${msg}</div>`;
            o.scrollTop = o.scrollHeight;
        }

        function parse(line) {
            let s = false, r = '', i = 0;
            while (i < line.length) {
                if (line[i] === '"') { s = !s; r += line[i]; i++; continue; }
                if (!s && line.startsWith('-com-', i)) {
                    let e = line.indexOf('-com-', i + 5);
                    if (e !== -1) { i = e + 5; continue; }
                }
                r += line[i];
                i++;
            }
            return r.trim();
        }

        function interp(str) {
            return str.replace(/var\{([^}]+)\}/g, (m, n) => V[n] !== undefined ? V[n] : m);
        }

        function run(code) {
            V = {};
            let o = document.getElementById('output');
            o.innerHTML = '';
            out('log', 'running...');

            let lines = code.split('\n');

            for (let i = 0; i < lines.length; i++) {
                let line = parse(lines[i]);
                if (line === '') continue;
                try {
                    if (line.startsWith('definevar')) {
                        let m = line.match(/definevar\(([^,]+),\s*(.+)\)/);
                        if (m) {
                            let n = m[1].trim(), v = m[2].trim();
                            if (v.startsWith('[') && v.endsWith(']')) {
                                let a = v.slice(1, -1).split(',').map(x => {
                                    let t = x.trim();
                                    return (t.startsWith('"') && t.endsWith('"')) ? t.slice(1, -1) : (isNaN(t) ? t : parseFloat(t));
                                });
                                V[n] = a;
                                out('success', n + ' = [' + a + ']');
                            } else if (v.startsWith('"') && v.endsWith('"')) {
                                V[n] = interp(v.slice(1, -1));
                                out('success', n + ' = "' + V[n] + '"');
                            } else if (!isNaN(v)) {
                                V[n] = parseFloat(v);
                                out('success', n + ' = ' + V[n]);
                            } else {
                                V[n] = v;
                                out('success', n + ' = ' + v);
                            }
                        }
                    } else if (line.startsWith('add')) {
                        let m = line.match(/add\(([^,]+),\s*(.+)\)/);
                        if (m) {
                            let n = m[1].trim(), v = parseFloat(m[2].trim());
                            if (V[n] !== undefined && typeof V[n] === 'number') {
                                V[n] += v;
                                out('success', n + ' = ' + V[n]);
                            } else {
                                out('error', 'var ' + n + ' not a number');
                            }
                        }
                    } else if (line.startsWith('subtract')) {
                        let m = line.match(/subtract\(([^,]+),\s*(.+)\)/);
                        if (m) {
                            let n = m[1].trim(), v = parseFloat(m[2].trim());
                            if (V[n] !== undefined && typeof V[n] === 'number') {
                                V[n] -= v;
                                out('success', n + ' = ' + V[n]);
                            } else {
                                out('error', 'var ' + n + ' not a number');
                            }
                        }
                    } else if (line.startsWith('CC++++.log')) {
                        let m = line.match(/CC++++\.log\(["']([^"']*)["']\)/);
                        if (m) out('log', interp(m[1]));
                    } else if (line.startsWith('CC++++.warn')) {
                        let m = line.match(/CC++++\.warn\(["']([^"']*)["']\)/);
                        if (m) out('warn', interp(m[1]));
                    } else if (line.startsWith('CC++++.error')) {
                        let m = line.match(/CC++++\.error\(["']([^"']*)["']\)/);
                        if (m) out('error', interp(m[1]));
                    } else {
                        out('error', 'unknown: ' + line.slice(0, 40));
                    }
                } catch (e) {
                    out('error', 'line ' + (i + 1) + ': ' + e.message);
                }
            }
            out('success', 'done');
        }

        let last = '';

        function watch() {
            fetch('code.txt')
                .then(r => r.ok ? r.text() : null)
                .then(d => {
                    if (d !== null && d !== last) {
                        last = d;
                        run(d);
                    }
                })
                .catch(() => {});
        }

        setInterval(watch, 2000);
        window.onload = watch;
    </script>
</body>
</html>
